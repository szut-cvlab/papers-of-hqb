name: Deploy VitePress site to Pages

on:
  # 推送到 master 分支时自动部署
  push:
    branches: [master]
  # 也允许在 GitHub 网页手动点按钮触发
  workflow_dispatch:

# 必须的权限，否则 deploy-pages 会失败
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，避免互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run docs:build
        env:
          # 关键：告诉 vitepress 站点部署在子路径下，资源引用才不会 404
          PAGES_BASE: /papers-of-hqb/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
